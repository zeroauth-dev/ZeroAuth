# mobile/gradle/libs.versions.toml — version catalog for the Phase 1 Pramaan
# Android subtree. Single source of truth for plugin + dependency versions
# across :app, :prover, :sensors:r307, :sensors:biometric_prompt.
#
# This catalog is INTENTIONALLY a different pin from the W3 spike at
# android/gradle/libs.versions.toml — the spike runs on Kotlin 2.0 +
# AGP 8.5 with the K2 compose compiler plugin, the Phase 1 prover tree
# pins to a stable older quartet (Kotlin 1.9.22 + AGP 8.3.x + Gradle 8.6 +
# the legacy compose-compiler plugin) until C-104 lands the rapidsnark JNI
# bridge and we can re-evaluate the toolchain together with the JNI POC.
#
# Aliases use dash separators per Gradle convention. The Kotlin DSL
# accessors are camel-cased (libs.androidx.compose.bom → the entry below
# named `androidx-compose-bom`).

[versions]
# ── Build tooling ─────────────────────────────────────────────────────────
agp                       = "8.3.2"
kotlin                    = "1.9.22"

# ── AndroidX core / lifecycle / activity ──────────────────────────────────
androidx-core-ktx         = "1.12.0"
androidx-lifecycle        = "2.7.0"
androidx-activity-compose = "1.8.2"

# ── Compose (Kotlin 1.9.22 → compose-compiler 1.5.10) ─────────────────────
compose-bom               = "2024.02.02"
compose-compiler          = "1.5.10"
# Standalone material3 pin used by :face. The Compose BOM in :app
# resolves material3 to the BOM-aligned version; :face is a library
# module that may be consumed without the BOM in place, so it pins an
# explicit material3 version to keep the API surface predictable.
androidx-compose-material3 = "1.1.2"

# ── CameraX (used by :face for the preview pipeline) ─────────────────────
# 1.3.1 is the stable line at the time of the C-143 enrollment-flow
# commit. The CameraX BOM is intentionally NOT used here; the four
# artefacts are version-locked together by hand so that bumping CameraX
# is a single-PR review surface.
camerax                   = "1.3.1"

# ── ML Kit Face Detection (used by :face for the liveness gate) ─────────
# On-device detection only. We pin the bundled-model artefact name
# `face-detection` — the unbundled variant `face-detection-base` would
# fetch the model lazily over the network at first use, which violates
# the "biometric data never crosses the network" non-goal in the
# CLAUDE.md constitution and ADR 0017's blockchain-agnostic posture
# (the platform must work fully offline at the device boundary).
mlkit-face-detection      = "16.1.5"

# ── kotlinx-coroutines (used by :face for the detector wrapper) ─────────
# Pinned to match the AndroidX lifecycle 2.7.0 transitive resolution to
# avoid Gradle's "conflicting kotlinx-coroutines versions" warning.
kotlinx-coroutines        = "1.7.3"

# ── Test ──────────────────────────────────────────────────────────────────
junit                     = "4.13.2"
androidx-test-junit       = "1.1.5"
androidx-test-runner      = "1.5.2"
androidx-test-core        = "1.5.0"
espresso-core             = "3.5.1"

[libraries]
# ── Core / lifecycle / activity ──────────────────────────────────────────
androidx-core-ktx                  = { group = "androidx.core",        name = "core-ktx",              version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle",   name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-activity-compose          = { group = "androidx.activity",    name = "activity-compose",      version.ref = "androidx-activity-compose" }

# ── Compose — BOM keeps the constellation aligned ────────────────────────
androidx-compose-bom               = { group = "androidx.compose",            name = "compose-bom" }
androidx-compose-ui                = { group = "androidx.compose.ui",         name = "ui" }
androidx-compose-ui-graphics       = { group = "androidx.compose.ui",         name = "ui-graphics" }
androidx-compose-ui-tooling        = { group = "androidx.compose.ui",         name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-material3         = { group = "androidx.compose.material3",  name = "material3" }
# Standalone material3 entry for :face (carries an explicit version
# because :face is a library that may be consumed outside the BOM).
androidx-compose-material3-pinned  = { group = "androidx.compose.material3",  name = "material3",            version.ref = "androidx-compose-material3" }

# ── CameraX — preview pipeline for :face ────────────────────────────────
# camera-core   — common surfaces (ImageProxy, CameraSelector).
# camera-camera2 — Camera2 implementation; required at runtime.
# camera-lifecycle — bind use cases to a LifecycleOwner.
# camera-view   — PreviewView for the Compose AndroidView interop.
androidx-camera-core               = { group = "androidx.camera",      name = "camera-core",       version.ref = "camerax" }
androidx-camera-camera2            = { group = "androidx.camera",      name = "camera-camera2",    version.ref = "camerax" }
androidx-camera-lifecycle          = { group = "androidx.camera",      name = "camera-lifecycle",  version.ref = "camerax" }
androidx-camera-view               = { group = "androidx.camera",      name = "camera-view",       version.ref = "camerax" }

# ── ML Kit Face Detection — liveness gate for :face ────────────────────
mlkit-face-detection               = { group = "com.google.mlkit",     name = "face-detection",    version.ref = "mlkit-face-detection" }

# ── kotlinx-coroutines — coroutine glue for the ML Kit Task bridge ─────
kotlinx-coroutines-core            = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-play-services   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }

# ── Test ─────────────────────────────────────────────────────────────────
junit                              = { group = "junit",                       name = "junit",                version.ref = "junit" }
androidx-test-junit                = { group = "androidx.test.ext",           name = "junit",                version.ref = "androidx-test-junit" }
androidx-test-core                 = { group = "androidx.test",               name = "core",                 version.ref = "androidx-test-core" }
androidx-test-runner               = { group = "androidx.test",               name = "runner",               version.ref = "androidx-test-runner" }
androidx-test-espresso-core        = { group = "androidx.test.espresso",      name = "espresso-core",        version.ref = "espresso-core" }
androidx-compose-ui-test-junit4    = { group = "androidx.compose.ui",         name = "ui-test-junit4" }
androidx-compose-ui-test-manifest  = { group = "androidx.compose.ui",         name = "ui-test-manifest" }

[plugins]
# Kotlin 1.9.22 path: Compose has no separate Gradle plugin yet; the
# `composeOptions { kotlinCompilerExtensionVersion = ... }` block inside
# the android {} block of each consuming module wires the compose-compiler
# plugin against the compose-compiler version pinned above. The Kotlin 2.x
# `org.jetbrains.kotlin.plugin.compose` plugin becomes the right move once
# the toolchain bump lands post-C-104.
android-application                = { id = "com.android.application",      version.ref = "agp" }
android-library                    = { id = "com.android.library",          version.ref = "agp" }
kotlin-android                     = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[bundles]
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]
compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-test-manifest",
]
# CameraX — the four artefacts pinned together by the `camerax` version.
camerax = [
    "androidx-camera-core",
    "androidx-camera-camera2",
    "androidx-camera-lifecycle",
    "androidx-camera-view",
]
