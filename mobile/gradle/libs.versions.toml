# mobile/gradle/libs.versions.toml — version catalog for the Phase 1 Pramaan
# Android subtree. Single source of truth for plugin + dependency versions
# across :app, :prover, :sensors:r307, :sensors:biometric_prompt.
#
# This catalog is INTENTIONALLY a different pin from the W3 spike at
# android/gradle/libs.versions.toml — the spike runs on Kotlin 2.0 +
# AGP 8.5 with the K2 compose compiler plugin, the Phase 1 prover tree
# pins to a stable older quartet (Kotlin 1.9.22 + AGP 8.3.x + Gradle 8.6 +
# the legacy compose-compiler plugin) until C-104 lands the rapidsnark JNI
# bridge and we can re-evaluate the toolchain together with the JNI POC.
#
# Aliases use dash separators per Gradle convention. The Kotlin DSL
# accessors are camel-cased (libs.androidx.compose.bom → the entry below
# named `androidx-compose-bom`).

[versions]
# ── Build tooling ─────────────────────────────────────────────────────────
agp                       = "8.3.2"
kotlin                    = "1.9.22"

# ── AndroidX core / lifecycle / activity ──────────────────────────────────
androidx-core-ktx         = "1.12.0"
androidx-lifecycle        = "2.7.0"
androidx-activity-compose = "1.8.2"

# ── Compose (Kotlin 1.9.22 → compose-compiler 1.5.10) ─────────────────────
compose-bom               = "2024.02.02"
compose-compiler          = "1.5.10"

# ── Test ──────────────────────────────────────────────────────────────────
junit                     = "4.13.2"
androidx-test-junit       = "1.1.5"
androidx-test-runner      = "1.5.2"
androidx-test-core        = "1.5.0"
espresso-core             = "3.5.1"

[libraries]
# ── Core / lifecycle / activity ──────────────────────────────────────────
androidx-core-ktx                  = { group = "androidx.core",        name = "core-ktx",              version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle",   name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-activity-compose          = { group = "androidx.activity",    name = "activity-compose",      version.ref = "androidx-activity-compose" }

# ── Compose — BOM keeps the constellation aligned ────────────────────────
androidx-compose-bom               = { group = "androidx.compose",            name = "compose-bom" }
androidx-compose-ui                = { group = "androidx.compose.ui",         name = "ui" }
androidx-compose-ui-graphics       = { group = "androidx.compose.ui",         name = "ui-graphics" }
androidx-compose-ui-tooling        = { group = "androidx.compose.ui",         name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
androidx-compose-material3         = { group = "androidx.compose.material3",  name = "material3" }

# ── Test ─────────────────────────────────────────────────────────────────
junit                              = { group = "junit",                       name = "junit",                version.ref = "junit" }
androidx-test-junit                = { group = "androidx.test.ext",           name = "junit",                version.ref = "androidx-test-junit" }
androidx-test-core                 = { group = "androidx.test",               name = "core",                 version.ref = "androidx-test-core" }
androidx-test-runner               = { group = "androidx.test",               name = "runner",               version.ref = "androidx-test-runner" }
androidx-test-espresso-core        = { group = "androidx.test.espresso",      name = "espresso-core",        version.ref = "espresso-core" }
androidx-compose-ui-test-junit4    = { group = "androidx.compose.ui",         name = "ui-test-junit4" }
androidx-compose-ui-test-manifest  = { group = "androidx.compose.ui",         name = "ui-test-manifest" }

[plugins]
# Kotlin 1.9.22 path: Compose has no separate Gradle plugin yet; the
# `composeOptions { kotlinCompilerExtensionVersion = ... }` block inside
# the android {} block of each consuming module wires the compose-compiler
# plugin against the compose-compiler version pinned above. The Kotlin 2.x
# `org.jetbrains.kotlin.plugin.compose` plugin becomes the right move once
# the toolchain bump lands post-C-104.
android-application                = { id = "com.android.application",      version.ref = "agp" }
android-library                    = { id = "com.android.library",          version.ref = "agp" }
kotlin-android                     = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[bundles]
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]
compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-test-manifest",
]
