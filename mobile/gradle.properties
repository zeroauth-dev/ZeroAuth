# mobile/gradle.properties — project-wide Gradle + Kotlin options for the
# Pramaan Phase 1 Android subtree. Tuned for the rapidsnark JNI build
# (C-104) which loads ~80 MB of intermediate witness JSON during proof
# generation; the JVM heap below sized to comfortably hold it.

# ── JVM / Gradle daemon ───────────────────────────────────────────────────
# 4 GB heap + parallel collector. JNI POC profiling showed the witness-
# parsing pass touches ~200 MB peak; 4 GB leaves headroom for the rest of
# the build. -Dfile.encoding=UTF-8 is non-negotiable for Kotlin source on
# the Linux CI runner.
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Parallel + cached builds. Configuration cache is OFF for now — the JNI
# wrapper Gradle plugin we plan to introduce in C-104 isn't yet
# configuration-cache-safe.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ── AndroidX + Jetpack ────────────────────────────────────────────────────
# AndroidX is mandatory (we never resolved a non-AndroidX support-library
# artefact). The legacy resource processor is off because we are on
# AGP 8.x which pulls in the new ResourceProcessor by default.
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# ── Kotlin ────────────────────────────────────────────────────────────────
# Match the JVM toolchain to Java 17 — the rapidsnark JNI wrapper uses
# `Cleaner` (Java 9+) and `MemorySegment` (Java 17) lookalikes.
kotlin.code.style=official
kotlin.jvm.target.validation.mode=warning

# ── Compose ───────────────────────────────────────────────────────────────
# K2 compose compiler plugin owns its own version mapping; nothing to set
# here. Left as a placeholder in case a future override is needed.
