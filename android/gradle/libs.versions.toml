# android/gradle/libs.versions.toml — version catalog for the W3 wrapper app.
#
# Single source of truth for every Android dependency. Bumping a library means
# bumping it here. The catalog is referenced from settings.gradle.kts via
# versionCatalogs.create("libs") { from(files("gradle/libs.versions.toml")) }.
#
# Stack pinned by the previous design decision — see CLAUDE.md + ADR-0009/0010.
# Aliases use dash separators in this file; Gradle generates camelCase
# accessors (libs.androidx.compose.bom etc.) automatically.

[versions]
# Build tooling
agp                       = "8.5.2"
kotlin                    = "2.0.20"
# AndroidX core / lifecycle / activity
androidx-core-ktx         = "1.13.1"
androidx-lifecycle        = "2.8.6"
androidx-activity-compose = "1.9.2"
# Compose
compose-bom               = "2024.09.03"
compose-navigation        = "2.8.2"
# Biometric (alpha, but it's the only API that does Class 3 + crypto-bound)
androidx-biometric        = "1.2.0-alpha05"
# CameraX
camerax                   = "1.3.4"
# ML Kit barcode scanning (bundled — no Play Services dependency at install)
mlkit-barcode             = "17.3.0"
# ML Kit face detection (bundled — model ships in the APK so the face-
# capture composable in ui/face/ works offline. Pinned alongside the
# barcode scanner because both use the same ML Kit common runtime; bumping
# one without the other risks a transitive constraint conflict.)
mlkit-face                = "16.1.7"
# ZXing (for the *generation* side, used in a follow-on iteration; pinned now
# so the catalog is complete).
zxing-core                = "3.5.3"
# Networking + serialization
okhttp                    = "4.12.0"
retrofit                  = "2.11.0"
kotlinx-serialization     = "1.7.1"
# Logging (debug only — see ZeroAuthApp.kt)
timber                    = "5.0.1"
# Coroutines — used by BiometricGate to wrap BiometricPrompt in a suspend fun
# (matched to kotlinx-coroutines-test below so the production + test
# variants stay on the same minor)
kotlinx-coroutines        = "1.8.1"
# Jetpack Security — EncryptedFile + Master-key helper for the Keystore vault
androidx-security-crypto  = "1.1.0-alpha06"
# AndroidX WebKit — WebViewAssetLoader for serving the bundled prover
# assets over a synthetic appassets.androidplatform.net origin (ADR-0010).
androidx-webkit           = "1.11.0"
# Test
junit                     = "4.13.2"
androidx-test-junit       = "1.2.1"
# androidx.test:core for ApplicationProvider — used by Robolectric tests
# (AndroidKeystoreManagerTest pulls the host application from this).
androidx-test-core        = "1.6.1"
espresso-core             = "3.6.1"
# Unit-level testing (Robolectric so we don't need a connected device for ViewModel tests;
# Turbine for ergonomic StateFlow assertions; kotlinx-coroutines-test for runTest).
robolectric               = "4.13"
turbine                   = "1.1.0"
kotlinx-coroutines-test   = "1.8.1"
mockito-kotlin            = "5.4.0"

# ── :biometric module deps ────────────────────────────────────────────────
# TensorFlow Lite — runs MobileFaceNet inference on CPU/NNAPI/GPU. The
# 2.15.0 wheel is the stable line that ships with AGP 8.5; the support
# library (FileUtil, NormalizeOp, etc.) is matched to the same minor.
# Pinned via ADR-0018 (mobile face-embedding pipeline).
tensorflow-lite           = "2.15.0"
tensorflow-lite-support   = "0.4.4"

# BouncyCastle — Keccak-256 (EVM-flavour, pre-NIST padding) used for the
# DID derivation in :biometric. Android's stdlib MessageDigest only
# provides SHA-3-family Keccak; the on-chain DIDRegistry uses the EVM
# variant so we need BC here for byte-for-byte parity with the contract.
bouncycastle-provider     = "1.78.1"

# Guava — `ListenableFuture` surface from CameraX. CameraX 1.3.x marks
# Guava as `compileOnly`, so :app (which calls `ProcessCameraProvider
# .getInstance(...)` and reads the returned future) must declare it
# itself. Pinned to the Android-flavoured wheel because the plain
# `com.google.guava:guava` JRE jar conflicts with the
# `com.google.guava:listenablefuture:1.0` placeholder Maven picks via
# the empty-to-avoid-conflict version override.
guava                     = "33.3.0-android"

[libraries]
# Core / lifecycle / activity
androidx-core-ktx                  = { group = "androidx.core",        name = "core-ktx",                       version.ref = "androidx-core-ktx" }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle",   name = "lifecycle-runtime-ktx",          version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle",   name = "lifecycle-runtime-compose",      version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",    version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-ktx     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",        version.ref = "androidx-lifecycle" }
androidx-activity-compose          = { group = "androidx.activity",    name = "activity-compose",               version.ref = "androidx-activity-compose" }

# Compose — BOM keeps the constellation aligned without per-artifact versions
androidx-compose-bom               = { group = "androidx.compose",     name = "compose-bom",                    version.ref = "compose-bom" }
androidx-compose-ui                = { group = "androidx.compose.ui",  name = "ui" }
androidx-compose-ui-graphics       = { group = "androidx.compose.ui",  name = "ui-graphics" }
androidx-compose-ui-tooling        = { group = "androidx.compose.ui",  name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3         = { group = "androidx.compose.material3", name = "material3" }
# Standalone material3 entry for the :face module. :face is a library
# module without the Compose BOM applied at its boundary (BOMs are not
# transitive), so it pins material3 explicitly to keep the API surface
# predictable when consumed from :app. The version it resolves to comes
# from the BOM's transitive constraint inside :app — having a separate
# alias just makes the intent clear at the call-site.
androidx-compose-material3-pinned  = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-navigation        = { group = "androidx.navigation", name = "navigation-compose",              version.ref = "compose-navigation" }

# Biometric
androidx-biometric                 = { group = "androidx.biometric",   name = "biometric",                      version.ref = "androidx-biometric" }

# Jetpack Security — used by the Keystore module for forward-compat
# (EncryptedFile / MasterKey shape that the production at-rest store
# may opt into once we outgrow the hand-rolled AES-GCM blob).
androidx-security-crypto           = { group = "androidx.security",    name = "security-crypto",                version.ref = "androidx-security-crypto" }

# AndroidX WebKit — WebViewAssetLoader for serving the bundled prover
# assets over a synthetic appassets.androidplatform.net origin (ADR-0010).
androidx-webkit                    = { group = "androidx.webkit",      name = "webkit",                         version.ref = "androidx-webkit" }

# Coroutines — AndroidBiometricGate wraps BiometricPrompt in a suspend fun.
# The -core variant is needed by :biometric (pure JVM coroutine scaffolding,
# no Android Looper dependency); -play-services is the Task<>→ await bridge
# used by :face for the ML Kit detector. Pinned to the same `kotlinx-
# coroutines` version so the three artefacts stay in lock-step.
kotlinx-coroutines-core            = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",        version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",     version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-play-services   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }

# CameraX
androidx-camera-core               = { group = "androidx.camera",      name = "camera-core",                    version.ref = "camerax" }
androidx-camera-camera2            = { group = "androidx.camera",      name = "camera-camera2",                 version.ref = "camerax" }
androidx-camera-lifecycle          = { group = "androidx.camera",      name = "camera-lifecycle",               version.ref = "camerax" }
androidx-camera-view               = { group = "androidx.camera",      name = "camera-view",                    version.ref = "camerax" }

# ML Kit barcode (bundled flavor — model ships in the APK, no Play Services
# install-time download).
mlkit-barcode-scanning             = { group = "com.google.mlkit",     name = "barcode-scanning",               version.ref = "mlkit-barcode" }

# ML Kit face detection (bundled flavor — same install-time guarantee
# as the barcode scanner). Drives the ui/face/FaceCaptureScreen
# composable. The artefact name is `face-detection`; the Play Services
# variant would be `play-services-mlkit-face-detection`. We pick the
# `com.google.mlkit:face-detection` flavour because the W3 wrapper has
# zero Play Services dependency budget — installs must work on
# Play-services-less ROMs and on first launch without a network round
# trip.
mlkit-face-detection               = { group = "com.google.mlkit",     name = "face-detection",                 version.ref = "mlkit-face" }

# ZXing core — used by the proof-side QR *generation* in a follow-on iteration.
# Imported here so the catalog is complete and bumps stay in one place.
zxing-core                         = { group = "com.google.zxing",     name = "core",                           version.ref = "zxing-core" }

# Networking
okhttp                             = { group = "com.squareup.okhttp3", name = "okhttp",                         version.ref = "okhttp" }
okhttp-logging-interceptor         = { group = "com.squareup.okhttp3", name = "logging-interceptor",            version.ref = "okhttp" }
retrofit-core                      = { group = "com.squareup.retrofit2", name = "retrofit",                     version.ref = "retrofit" }
# The JakeWharton retrofit2-kotlinx-serialization-converter was rolled
# into the official retrofit project as of retrofit 2.10.0; the package
# path stays `retrofit2.converter.kotlinx.serialization.asConverterFactory`
# either way, but only the official artifact resolves cleanly with
# retrofit 2.11.0 on the classpath.
retrofit-kotlinx-serialization     = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json         = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",    version.ref = "kotlinx-serialization" }

# Logging
timber                             = { group = "com.jakewharton.timber", name = "timber",                       version.ref = "timber" }

# Test
junit                              = { group = "junit",                name = "junit",                          version.ref = "junit" }
androidx-test-junit                = { group = "androidx.test.ext",    name = "junit",                          version.ref = "androidx-test-junit" }
androidx-test-core                 = { group = "androidx.test",        name = "core",                           version.ref = "androidx-test-core" }
androidx-test-espresso-core        = { group = "androidx.test.espresso", name = "espresso-core",                version.ref = "espresso-core" }
androidx-compose-ui-test-junit4    = { group = "androidx.compose.ui",  name = "ui-test-junit4" }
androidx-compose-ui-test-manifest  = { group = "androidx.compose.ui",  name = "ui-test-manifest" }
# Robolectric runs Android-shadowed unit tests on the JVM so ViewModel/StateFlow tests
# don't need an emulator. Turbine wraps StateFlow under runTest. mockito-kotlin lets
# us mock the FragmentActivity dependency the BiometricGate signature requires.
robolectric                        = { group = "org.robolectric",      name = "robolectric",                    version.ref = "robolectric" }
turbine                            = { group = "app.cash.turbine",     name = "turbine",                        version.ref = "turbine" }
kotlinx-coroutines-test            = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",       version.ref = "kotlinx-coroutines-test" }
mockito-kotlin                     = { group = "org.mockito.kotlin",   name = "mockito-kotlin",                 version.ref = "mockito-kotlin" }
# kotlin-test — used by :biometric's pure-JVM unit tests (assertEquals
# with array equality semantics). Pinned to the same Kotlin version as
# the rest of the toolchain.
kotlin-test                        = { group = "org.jetbrains.kotlin", name = "kotlin-test",                    version.ref = "kotlin" }

# ── :biometric module deps ───────────────────────────────────────────────
tensorflow-lite                    = { group = "org.tensorflow",       name = "tensorflow-lite",                version.ref = "tensorflow-lite" }
tensorflow-lite-support            = { group = "org.tensorflow",       name = "tensorflow-lite-support",        version.ref = "tensorflow-lite-support" }
bouncycastle-provider              = { group = "org.bouncycastle",     name = "bcprov-jdk18on",                 version.ref = "bouncycastle-provider" }

# ── Guava (CameraX ListenableFuture surface, consumed in :app) ──────────
guava                              = { group = "com.google.guava",     name = "guava",                          version.ref = "guava" }

[plugins]
android-application                = { id = "com.android.application",        version.ref = "agp" }
# :biometric and :face are library modules, not applications.
android-library                    = { id = "com.android.library",            version.ref = "agp" }
kotlin-android                     = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-serialization               = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose                     = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[bundles]
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]
compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-test-manifest",
]
camerax = [
    "androidx-camera-core",
    "androidx-camera-camera2",
    "androidx-camera-lifecycle",
    "androidx-camera-view",
]
network = [
    "okhttp",
    "okhttp-logging-interceptor",
    "retrofit-core",
    "retrofit-kotlinx-serialization",
    "kotlinx-serialization-json",
]
