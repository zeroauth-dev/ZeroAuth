<!DOCTYPE html>
<!--
  prover.html — Hosting page for the WebView-side snarkjs prover.

  Per ADR-0010 the CSP below is locked down to "no network, no eval,
  no inline" so that even a runtime code-injection bug cannot exfil
  the biometricSecret. `wasm-unsafe-eval` is required only because
  snarkjs compiles the circuit WASM at runtime; every other surface
  is denied.

  All scripts are loaded from the bundled APK assets via
  `WebViewAssetLoader` against the synthetic origin
  https://appassets.androidplatform.net/assets/prover/.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    connect-src 'self':
    snarkjs.groth16.fullProve internally calls `fetch(wasmPath)` and
    `fetch(zkeyPath)` to stream the BN128 circuit + proving key into
    WebAssembly. Both files live under the same synthetic origin
    (https://appassets.androidplatform.net/assets/prover/) served by
    WebViewAssetLoader, which only resolves paths to bundled APK
    assets — there is no real network egress. `'none'` here would
    block the wasm/zkey fetches and the prover never runs. Original
    ADR-0010 intent ("no network egress") still holds because the
    synthetic origin can never reach the public internet; the CSP
    correctly forbids cross-origin connect.
  -->
  <!--
    worker-src 'self' blob::
    snarkjs.groth16.fullProve spawns a Web Worker from a Blob URL to
    run the proof-witness generation off the main thread. The Blob is
    constructed in-page from snarkjs.min.js bytes, so `'self'` would
    suffice in principle, but Chromium requires `blob:` to be listed
    explicitly when the URL scheme is `blob:`. No third-party code is
    executed — the worker source is the same bundled snarkjs.

    script-src has `'self'` (bundled scripts) + `'wasm-unsafe-eval'`
    (snarkjs compiles wasm at runtime). The narrow blob:
    allowance only widens worker-src.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'none'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none';" />
  <title>ZeroAuth prover</title>
  <style>
    /* style-src 'self' 'unsafe-inline' allows this <style>; no external CSS. */
    html, body { margin: 0; padding: 0; background: #000; color: #fff; font: 14px monospace; }
    #status { padding: 12px; }
  </style>
</head>
<body>
  <!-- Operator-visible probe; the Android wrapper never reads this. -->
  <div id="status">prover: loading&hellip;</div>

  <!-- Load order matters: poseidon helper first (constants), then snarkjs
       (provides `snarkjs.groth16`), then the prover glue that wires the
       JavaScriptInterface. -->
  <script src="poseidon.js"></script>
  <script src="snarkjs.min.js"></script>
  <script src="prover.js"></script>
</body>
</html>
