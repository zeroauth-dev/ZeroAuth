# android/gradle.properties — root project properties.
#
# Generated 2026-05-25 to land the first green CI run. AGP 8.5 requires
# android.useAndroidX=true for any module that pulls in androidx.*, and
# every dep in libs.versions.toml (Compose, navigation, biometric,
# camera, security-crypto) is androidx.

# Required by AGP 8+. Without it the build aborts at
# :checkDebugAarMetadata with 'Configuration … contains AndroidX
# dependencies, but the android.useAndroidX property is not enabled'.
android.useAndroidX=true

# Strip legacy android.support.* shims at build time so a transitive
# old dep can't reintroduce them. Required when useAndroidX=true.
android.enableJetifier=false

# Modern non-transitive R classes — smaller dex, better incremental
# builds. AGP 8 default-true but explicit beats implicit.
android.nonTransitiveRClass=true

# Kotlin compiler settings.
kotlin.code.style=official

# JVM tuning for the Gradle daemon. The Compose compiler is RAM-hungry
# (~2 GB during heavy kapt-less builds) and the runner has ~7 GB. Cap
# at 4 GB so the daemon doesn't OOM the runner's CI step.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Parallel project execution — single-module project today, harmless.
org.gradle.parallel=true

# Configuration cache: opt-in, surfaces build-script bugs. Defer until
# we've debugged the verifyProverAssets task interaction (W4).
org.gradle.configuration-cache=false
